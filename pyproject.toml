[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmopt"
version = "0.1.0"
description = "Oracle-verified mathematics and physics ML lab: exact integer training, symbolic derivation search, MoE routing anatomy, calibration-free quantization, and an append-only verdict ledger"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Artin Azizi" }]
requires-python = ">=3.11"
keywords = [
    "reproducible-research",
    "symbolic-mathematics",
    "quantization",
    "mixture-of-experts",
    "deterministic-computing",
    "fixed-point-arithmetic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# sympy is core, not optional: it is the ORACLE. Symbolic equivalence is
# how this lab accepts an answer, so 18 modules import it directly and a
# torch-free install still needs it (mathgen, search, eval.equivalence).
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Hugging Face model paths only (4 lazy call sites: static-cache backend,
# gist context, batching, prefix reuse). Nothing imports transformers at
# module scope, so the core install does not need it.
hf = ["transformers>=4.44"]
# Apple-silicon kernels + MLX backend (llmopt/kernels/metal.py,
# llmopt/backends/mlx_backend.py, llmopt/lab/traj.py)
mlx = ["mlx>=0.15", "mlx-lm"]
# Parquet/DuckDB run-and-result lake (llmopt/lab/lake.py)
lake = ["pyarrow>=15", "duckdb>=1.0", "pandas>=2.0"]
# CUDA kernel experiments (llmopt/kernels/triton_kernels.py)
triton = ["triton>=3.0"]
# House figure style (llmopt/lab/figstyle.py, figures.py). Fonts are
# vendored in assets/fonts/, so only the plotting library is needed.
figures = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/39hops/llmopt"
"Verdict ledger" = "https://github.com/39hops/llmopt/blob/main/docs/RESULTS.md"
"Curated findings" = "https://github.com/39hops/llmopt/blob/main/docs/FINDINGS.md"
Reproduce = "https://github.com/39hops/llmopt/blob/main/docs/REPRODUCE.md"

[tool.setuptools.packages.find]
include = ["llmopt*"]

[tool.setuptools.package-data]
llmopt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# Narrow on purpose: dead imports/names only. Style rules wait.
select = ["F401", "F821", "F841"]

[tool.ruff.lint.per-file-ignores]
"scratch/*" = ["ALL"]
# Lazy-import re-export pattern (import llmopt.<pkg> costs nothing;
# torch/sympy load only when a name is used). The `if TYPE_CHECKING:`
# block exists only so static type checkers can see through
# `__getattr__` — the names are never used at runtime in the file
# itself, so F401 is a false positive on this architecture, not a
# dead import.
"llmopt/backends/__init__.py" = ["F401"]
"llmopt/cache/__init__.py" = ["F401"]
"llmopt/codegen/__init__.py" = ["F401"]
"llmopt/context/__init__.py" = ["F401"]
"llmopt/decoding/__init__.py" = ["F401"]
"llmopt/distill/__init__.py" = ["F401"]
"llmopt/eval/__init__.py" = ["F401"]
"llmopt/internals/__init__.py" = ["F401"]
"llmopt/kernels/__init__.py" = ["F401"]
"llmopt/mathgen/__init__.py" = ["F401"]
"llmopt/moe/__init__.py" = ["F401"]
"llmopt/quantize/__init__.py" = ["F401"]
"llmopt/quantum/__init__.py" = ["F401"]
"llmopt/search/__init__.py" = ["F401"]
"llmopt/train/__init__.py" = ["F401"]
"llmopt/weightspace/__init__.py" = ["F401"]
# scripts/ frozen evidence files (docs/CODEMAP.md class: results-cited)
# — never edit their bodies, not even a noqa comment.
"scripts/bench_budget_alloc.py" = ["F401"]
"scripts/bench_hints_ab.py" = ["F401"]
"scripts/bench_weight_anatomy.py" = ["F401"]
"scripts/train_value_head.py" = ["F401"]
# Vendored (tests/test_vendor_axiom.py enforces byte-identity against
# the sibling axiom repo checkout) — body is not ours to edit.
"llmopt/vendor/axiom/classify_sample.py" = ["F841"]
