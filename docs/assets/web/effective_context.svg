<text x="34" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#0b0b0b">Deep positions reach back more than a hundred tokens</text>
<text x="34" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Loss at positions past 128 when the model may see only the last k tokens. Every width improves by ~1 nat between k=16 and</text>
<text x="34" y="93" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">k=128, so the corpus really does carry long-range dependency. The gap BETWEEN widths does not order monotonically in k — it</text>
<text x="34" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">is negative at k=8 and narrows again at k=128 — so the registered width-buys-depth bar did not fire.</text>
