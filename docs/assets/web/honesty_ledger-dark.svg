<text x="34" y="44" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#ffffff">A fifth of the published record argues against the lab</text>
<text x="34" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7">Every claim in FINDINGS carries exactly one maturity tag. Nulls and retractions are published beside the wins, at the same</text>
<text x="34" y="93" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c3c2b7">prominence, because a ledger that only records successes cannot be checked.</text>
