<text x="34" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Every claim in FINDINGS carries exactly one maturity tag. Nulls and retractions are published beside the wins, at the same</text>
